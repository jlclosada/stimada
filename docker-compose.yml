services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stimada
      POSTGRES_USER: stimada
      POSTGRES_PASSWORD: stimada
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stimada -d stimada"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://stimada:stimada@db:5432/stimada
      DJANGO_SETTINGS_MODULE: config.settings.local
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - ./Comunidad_Stimada_BBDD - Comunidad.csv:/app/data/comunidad.csv:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi", "--workers", "2", "--bind", "0.0.0.0:8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
